name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Nov 11 2026: the runner's apt mirror (azure.archive.ubuntu.com) failed to
      # resolve for hours. A browser-only fallback skipped the FONT packages, so
      # header glyphs rendered in a fallback font and a 412x915 layout test
      # failed for the wrong reason. So: retry the full install (fonts included),
      # and fail loudly if it never succeeds - never test without the fonts.
      - name: Install Playwright browsers
        run: |
          for i in 1 2 3 4; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $i), retrying in 60 s"; sleep 60
          done
          exit 1

      - name: Titles check
        run: npm run titles:check

      - name: Test
        run: npm run test:ci

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
